<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="纸箱装载量与排布可视化工具" />
    <link rel="icon" href="data:," />
    <title>智能集装箱装柜计算器</title>
    <script>
      (() => {
        const storageKey = "STACKING_SKU_THEME_MODE";
        const supportedModes = ["light", "dark", "system"];
        let mode = "system";
        try {
          const storedMode = window.localStorage.getItem(storageKey);
          if (supportedModes.includes(storedMode)) mode = storedMode;
        } catch {
          // Use the system setting when storage is unavailable.
        }
        const prefersDark = typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolvedTheme = mode === "system" ? (prefersDark ? "dark" : "light") : mode;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.style.colorScheme = resolvedTheme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
